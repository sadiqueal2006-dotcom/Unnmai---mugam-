<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உண்மை முகம் - உண்மையின் குரல்</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #b30000;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-gray: #b0b0b0;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--bg-dark);
            padding: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }
        
        .brand-info {
            min-width: 0;
            overflow: hidden;
        }
        .brand-info h1 {
            margin: 0;
            font-size: 13px;
            font-weight: bold;
            color: #ff4d4d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-gray);
        }
        .nav-icons {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        .nav-icons button {
            cursor: pointer; padding: 8px 10px; background: #222; color: #fff;
            border: 0; border-radius: 50%; font-size: 14px;
        }
        .search-panel { display:none; padding: 10px 15px; background:#1e1e1e; }
        .search-panel input { width:100%; box-sizing:border-box; padding:11px; border-radius:7px; border:1px solid #555; background:#111; color:#fff; }
        @media print { header .nav-icons, .menu-grid, .ticker-bar, .search-panel { display:none !important; } body { background:#fff !important; color:#000 !important; } .news-card { break-inside:avoid; border:1px solid #aaa; background:#fff !important; color:#000 !important; } .news-desc,.news-meta { color:#333 !important; } }
        .ticker-bar {
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .ticker-bar > div { flex: 1; min-width: 0; }
        #ticker-text { display: inline-block; padding-left: 100%; animation: ticker-scroll 20s linear infinite; }
        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .ticker-bar:hover #ticker-text { animation-play-state: paused; }
        .ticker-title {
            background: #800000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            white-space: nowrap;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 15px;
        }
        .menu-item {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 30px;
            padding: 10px 4px;
            text-align: center;
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .menu-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
        .container {
            padding: 15px;
        }
        .section-title {
            font-size: 22px;
            font-weight: bold;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
            margin-bottom: 15px;
        }
        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .news-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        .news-content {
            padding: 15px;
        }
        .news-category {
            color: var(--primary);
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .news-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 8px 0;
        }
        .news-desc {
            font-size: 14px;
            color: var(--text-gray);
            margin: 0 0 10px 0;
        }
        .news-meta {
            font-size: 11px;
            color: #888;
            border-top: 1px solid #2a2a2a;
            padding-top: 8px;
        }
    </style>
</head>

                    <i class="fa-solid fa-image fa-2x"></i>
                </div>
                <div class="news-content">
                    <div class="news-category">கோவை</div>
                    <h3 class="news-title">டெமோ செய்தி</h3>
                    <p class="news-desc">உண்மை முகம் டெமோ செய்தி விபரம் இங்கே வரும்.</p>

                </div>

    <script>
        function loadNewsAndTicker() {
            // Check localStorage first
            let localNews = localStorage.getItem('um_news');
            let localTicker = localStorage.getItem('um_ticker');

            if(localNews) {
                try {
                    const data = JSON.parse(localNews);
                    renderNews(data);
                } catch(e) {
                    fetchNewsJson();
                }
            } else {
                fetchNewsJson();
            }

            if(localTicker) {
                try {
                    const tData = JSON.parse(localTicker);
                    if(tData && tData.text) {
                        document.getElementById('ticker-text').innerText = tData.text;
                    }
                } catch(e) {
                    fetchTickerJson();
                }
            } else {
                fetchTickerJson();
            }
        }

        function fetchNewsJson() {
            fetch('news.json')
                .then(res => res.json())
                .then(data => {
                    if(data && data.length > 0) {
                        renderNews(data);
                    }
                })
                .catch(err => console.log('Using default view'));
        }

        let allNews = [];
        function renderNews(data, keepOriginal = false) {
            if (!keepOriginal) allNews = Array.isArray(data) ? data : [];
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            allNews.forEach(item => {
                container.innerHTML += `
                    <div class="news-card">
                        ${item.image ? `<img src="${item.image}" class="news-img" alt="News Image">` : `<div class="news-img"><i class="fa-solid fa-image fa-2x"></i></div>`}
                        <div class="news-content">
                            <div class="news-category">${item.category || 'செய்தி'}</div>
                            <h3 class="news-title">${item.title}</h3>
                            <p class="news-desc">${item.description || ''}</p>
                            <div class="news-meta">நிருபர்: ${item.reporter || 'Admin'} • ${item.time || ''}</div>
                        </div>
                    </div>
                `;
            });
        }

        function fetchTickerJson() {
            fetch('ticker.json')
                .then(res => res.json())
                .then(data => {
                    if(data && data.text) {
                        document.getElementById('ticker-text').innerText = data.text;
                    }
                })
                .catch(err => {});
        }

        document.getElementById('search-toggle').addEventListener('click', () => {
            const panel = document.getElementById('search-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if (panel.style.display === 'block') document.getElementById('news-search').focus();
            else { document.getElementById('news-search').value = ''; renderNews(allNews); }
        });
        document.getElementById('news-search').addEventListener('input', function () {
            const q = this.value.trim().toLocaleLowerCase();
            const filtered = allNews.filter(n => [n.title,n.category,n.description,n.reporter].join(' ').toLocaleLowerCase().includes(q));
            renderNews(filtered, true);
            if (!filtered.length) document.getElementById('news-container').innerHTML = '<p style="color:#aaa;text-align:center">தேடலுக்கு பொருத்தமான செய்திகள் இல்லை.</p>';
        });
        document.getElementById('print-page').addEventListener('click', () => window.print());
        loadNewsAndTicker();
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    </script>
