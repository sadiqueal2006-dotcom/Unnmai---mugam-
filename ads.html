<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>விளம்பரங்கள் | உண்மை முகம்</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#b30000;--bg:#121212;--card:#1e1e1e;--muted:#b0b0b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:'Segoe UI',Tahoma,sans-serif}header{padding:16px;background:#181818;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between}header a{color:#fff;text-decoration:none}h1{font-size:20px;color:#ff5555;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}main{padding:16px;max-width:850px;margin:auto}.heading{font-size:21px;border-left:4px solid var(--primary);padding-left:10px;margin:10px 0 16px}.card{background:var(--card);border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:14px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #333}.row:last-child{border:0}.value{text-align:right;color:#fff}.btn{display:inline-block;background:var(--primary);color:white;text-decoration:none;padding:10px 14px;border-radius:7px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:25px 10px}a{color:#ff7777}.ad-title{font-size:17px;margin:0 0 8px}footer{text-align:center;color:#888;padding:20px;font-size:12px}
</style></head><body><header><div><h1>உண்மை முகம்</h1><div class="sub">உண்மையின் குரல்</div></div><a href="index.html"><i class="fa-solid fa-house"></i> முகப்பு</a></header><main><div class="heading">விளம்பரங்கள்</div><div id="ads-list"><div class="empty">விளம்பரங்கள் ஏற்றப்படுகின்றன...</div></div><p class="muted">உங்கள் கடை, சேவை, வேலைவாய்ப்பு அல்லது வணிக விளம்பரத்தை வெளியிட தொடர்பு கொள்ளுங்கள்.</p><a class="btn" id="contact" href="#"><i class="fa-brands fa-whatsapp"></i> விளம்பரம் கொடுக்க WhatsApp</a><script>
fetch('settings.json').then(r=>r.json()).then(settings=>{const n=(settings.whatsapp||'').replace(/\D/g,'');if(n)document.getElementById('contact').href='https://wa.me/91'+n+'?text='+encodeURIComponent('வணக்கம், உண்மை முகம் தளத்தில் விளம்பரம் வெளியிட விரும்புகிறேன்.');});
fetch('ads.json').then(r=>r.json()).then(items=>{const root=document.getElementById('ads-list');if(!Array.isArray(items)||!items.length){root.innerHTML='<div class="empty">தற்போது விளம்பரங்கள் இல்லை. விரைவில் புதுப்பிக்கப்படும்.</div>';return;}root.innerHTML=items.map(a=>`<article class="card"><div class="muted">${a.category||'விளம்பரம்'}</div><h2 class="ad-title">${a.title||'விளம்பரம்'}</h2><p>${a.description||''}</p>${a.image?`<img src="${a.image}" alt="விளம்பரம்" style="width:100%;border-radius:8px">`:''}${a.link?`<a class="btn" href="${a.link}" target="_blank" rel="noopener">மேலும் விவரம்</a>`:''}</article>`).join('');}).catch(()=>document.getElementById('ads-list').innerHTML='<div class="empty">விளம்பரங்களை இப்போது ஏற்ற முடியவில்லை.</div>');
</script></main><footer>உண்மை முகம் – உண்மையின் குரல்</footer></body></html>
