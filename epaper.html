<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Paper | உண்மை முகம்</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#b30000;--bg:#121212;--card:#1e1e1e;--muted:#b0b0b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:'Segoe UI',Tahoma,sans-serif}header{padding:16px;background:#181818;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between}header a{color:#fff;text-decoration:none}h1{font-size:20px;color:#ff5555;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}main{padding:16px;max-width:850px;margin:auto}.heading{font-size:21px;border-left:4px solid var(--primary);padding-left:10px;margin:10px 0 16px}.card{background:var(--card);border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:14px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #333}.row:last-child{border:0}.value{text-align:right;color:#fff}.btn{display:inline-block;background:var(--primary);color:white;text-decoration:none;padding:10px 14px;border-radius:7px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:25px 10px}a{color:#ff7777}.ad-title{font-size:17px;margin:0 0 8px}footer{text-align:center;color:#888;padding:20px;font-size:12px}
</style></head><body><header><div><h1>உண்மை முகம்</h1><div class="sub">உண்மையின் குரல்</div></div><a href="index.html"><i class="fa-solid fa-house"></i> முகப்பு</a></header><main><div class="heading">இ-பேப்பர்</div><div id="latest" class="card"><div class="empty">E-Paper விவரங்கள் ஏற்றப்படுகின்றன...</div></div><h2 style="font-size:17px">முந்தைய பதிப்புகள்</h2><div id="archive"></div><script>
fetch('editions.json').then(r=>r.json()).then(items=>{if(!Array.isArray(items))items=[];items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));const latest=document.getElementById('latest'),archive=document.getElementById('archive');if(!items.length){latest.innerHTML='<div class="empty"><i class="fa-regular fa-newspaper fa-2x"></i><p>இன்றைய E-Paper விரைவில் வெளியாகும்.</p></div>';return;}const card=e=>`<article class="card"><div class="muted">${e.date||''}</div><h3>${e.title||'உண்மை முகம் – E-Paper'}</h3>${e.description?`<p>${e.description}</p>`:''}${(e.pdf_data||e.pdf_url)?`<a class="btn" href="${e.pdf_data||e.pdf_url}" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i> PDF படிக்க / பதிவிறக்க</a>`:''}</article>`;latest.innerHTML=card(items[0]);archive.innerHTML=items.slice(1).map(card).join('')||'<div class="empty">முந்தைய பதிப்புகள் இல்லை.</div>';}).catch(()=>document.getElementById('latest').innerHTML='<div class="empty">E-Paper விவரங்களை ஏற்ற முடியவில்லை.</div>');
</script></main><footer>உண்மை முகம் – உண்மையின் குரல்</footer></body></html>
