<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>இன்றைய நாள் | உண்மை முகம்</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#b30000;--bg:#121212;--card:#1e1e1e;--muted:#b0b0b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:'Segoe UI',Tahoma,sans-serif}header{padding:16px;background:#181818;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between}header a{color:#fff;text-decoration:none}h1{font-size:20px;color:#ff5555;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}main{padding:16px;max-width:850px;margin:auto}.heading{font-size:21px;border-left:4px solid var(--primary);padding-left:10px;margin:10px 0 16px}.card{background:var(--card);border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:14px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #333}.row:last-child{border:0}.value{text-align:right;color:#fff}.btn{display:inline-block;background:var(--primary);color:white;text-decoration:none;padding:10px 14px;border-radius:7px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:25px 10px}a{color:#ff7777}.ad-title{font-size:17px;margin:0 0 8px}footer{text-align:center;color:#888;padding:20px;font-size:12px}
</style></head><body><header><div><h1>உண்மை முகம்</h1><div class="sub">உண்மையின் குரல்</div></div><a href="index.html"><i class="fa-solid fa-house"></i> முகப்பு</a></header><main><div class="heading">இன்றைய நாள்</div><section class="card"><div class="muted" id="current-date">இன்றைய தேதி</div><h2 id="special" style="color:#ff6666">இன்றைய நாள் சிறப்பு</h2><div id="details"><div class="empty">இன்றைய நாள் விவரங்கள் விரைவில் புதுப்பிக்கப்படும்.</div></div></section><section class="card" id="thought-card" style="display:none"><h3>இன்றைய சிந்தனை</h3><p id="thought"></p></section><script>
const tamilDate=new Intl.DateTimeFormat('ta-IN',{dateStyle:'full'}).format(new Date());document.getElementById('current-date').textContent=tamilDate;
fetch('today.json').then(r=>r.json()).then(d=>{if(Array.isArray(d))d=d[0]||{};const fields=[['சிறப்பு நாள்',d.special_day],['நல்ல நேரம்',d.good_time],['ராகு காலம்',d.rahukalam],['எமகண்டம்',d.yamagandam],['குறிப்புகள்',d.notes]];const rows=fields.filter(x=>x[1]).map(x=>`<div class="row"><strong>${x[0]}</strong><span class="value">${x[1]}</span></div>`).join('');document.getElementById('details').innerHTML=rows||'<div class="empty">இன்றைய நாள் விவரங்கள் விரைவில் புதுப்பிக்கப்படும்.</div>';if(d.special_day)document.getElementById('special').textContent=d.special_day;if(d.thought){document.getElementById('thought').textContent=d.thought;document.getElementById('thought-card').style.display='block';}}).catch(()=>{});
</script></main><footer>உண்மை முகம் – உண்மையின் குரல்</footer></body></html>
